# Render "Blueprint": tells Render how to build and run the backend.
# Create it from the Render dashboard: New + -> Blueprint -> pick your GitHub repo.
services:
  - type: web
    name: citewise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The AI models + PyTorch need roughly 1 GB of RAM, so a 512 MB plan will
    # likely crash. "standard" (2 GB) is the safe choice. Persistent disks
    # are only available on PAID plans.
    plan: free
    healthCheckPath: /health
    # The persistent disk: everything saved under /data survives restarts and redeploys.
    disk:
      name: citewise-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /data
      - key: SECRET_KEY
        generateValue: true      # Render creates a random secret for you
      - key: GOOGLE_API_KEY
        sync: false              # you paste this in the dashboard (never in git)
      - key: GOOGLE_CLIENT_ID
        sync: false              # from Google Cloud Console (see README), leave blank to hide the button
      - key: FRONTEND_ORIGINS
        sync: false              # your deployed frontend URL, e.g. https://citewise.vercel.app
